trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main

variables:
  NODE_VERSION: '22.x'
  artifactName: 'it-incident-hub-drop'

stages:
  - stage: Validate
    displayName: 'Validar y probar'
    jobs:
      - job: Validate
        displayName: 'Backend y frontend'
        pool:
          name: Default
        steps:
          - checkout: self
            displayName: 'Checkout del repositorio'

          - task: NodeTool@0
            displayName: 'Instalar Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: '$(NODE_VERSION)'

          - script: npm ci
            displayName: 'Instalar dependencias del backend'
            workingDirectory: backend

          - script: npm ci
            displayName: 'Instalar dependencias del frontend'
            workingDirectory: frontend

          - script: npm run prisma:generate
            displayName: 'Generar cliente Prisma'
            workingDirectory: backend

          - script: npm run build
            displayName: 'Compilar backend'
            workingDirectory: backend

          - script: npm test
            displayName: 'Ejecutar pruebas automatizadas'
            workingDirectory: backend

          - script: |
              if not exist devops\artifact-manifest.txt (
                echo ##vso[task.logissue type=error]No se encontro el manifiesto requerido para el artefacto de despliegue.
                exit /b 1
              )
            displayName: 'Validar manifiesto de artefacto'

          - script: npm run build
            displayName: 'Compilar frontend'
            workingDirectory: frontend

          - script: npm test
            displayName: 'Probar operaciones del frontend'
            workingDirectory: frontend

          - script: npm audit --audit-level=high
            displayName: 'Analizar vulnerabilidades de dependencias'
            workingDirectory: backend

          - script: npm audit --audit-level=high
            displayName: 'Analizar dependencias del frontend'
            workingDirectory: frontend

  - stage: Package
    displayName: 'Empaquetar y publicar'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: Package
        displayName: 'Crear artefacto de despliegue'
        pool:
          name: Default
        steps:
          - checkout: self
            displayName: 'Checkout para empaquetado'

          - task: NodeTool@0
            displayName: 'Instalar Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: '$(NODE_VERSION)'

          - script: npm ci
            displayName: 'Restaurar dependencias del backend'
            workingDirectory: backend

          - script: npm ci
            displayName: 'Restaurar dependencias del frontend'
            workingDirectory: frontend

          - script: npm run prisma:generate
            displayName: 'Generar cliente Prisma para empaquetado'
            workingDirectory: backend

          - script: npm run build
            displayName: 'Construir backend para artefacto'
            workingDirectory: backend

          - script: npm run build
            displayName: 'Construir frontend para artefacto'
            workingDirectory: frontend

          - task: CopyFiles@2
            displayName: 'Preparar archivos publicables'
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)'
              Contents: |
                backend/dist/**
                backend/package.json
                backend/package-lock.json
                frontend/dist/**
                devops/artifact-manifest.txt
                devops/verify-release.mjs
                backend/prisma/**
                database/**
                compose.yaml
                README.md
              TargetFolder: '$(Build.ArtifactStagingDirectory)/it-incident-hub'

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar artefacto'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/it-incident-hub'
              ArtifactName: '$(artifactName)'
              publishLocation: 'Container'

  - stage: Release
    displayName: 'Aprobar entrega'
    dependsOn: Package
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApprovePackage
        displayName: 'Validar paquete aprobado'
        pool:
          name: Default
        environment: 'incident-hub-release'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none
                - task: NodeTool@0
                  inputs:
                    versionSpec: '$(NODE_VERSION)'
                - task: DownloadBuildArtifacts@1
                  displayName: 'Descargar artefacto de esta ejecución'
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: '$(artifactName)'
                    downloadPath: '$(Pipeline.Workspace)/approved-package'
                - script: node devops/verify-release.mjs .
                  displayName: 'Verificar contenido y versión aprobados'
                  workingDirectory: '$(Pipeline.Workspace)/approved-package/$(artifactName)'
