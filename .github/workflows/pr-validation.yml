name: Validacion de pull requests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Compilar, probar y revisar dependencias
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Probar integridad de artefactos
        run: node --test tests/artifact-integrity.test.mjs

      - name: Instalar dependencias del backend
        run: npm ci
        working-directory: backend

      - name: Generar cliente Prisma
        run: npm run prisma:generate
        working-directory: backend

      - name: Validar esquema Prisma
        run: npm run prisma:validate
        working-directory: backend

      - name: Compilar backend
        run: npm run build
        working-directory: backend

      - name: Probar backend
        run: npm test
        working-directory: backend

      - name: Auditar dependencias del backend
        run: npm audit --audit-level=high
        working-directory: backend

      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: frontend

      - name: Compilar frontend
        run: npm run build
        working-directory: frontend

      - name: Probar operaciones del frontend
        run: npm test
        working-directory: frontend

      - name: Auditar dependencias del frontend
        run: npm audit --audit-level=high
        working-directory: frontend
